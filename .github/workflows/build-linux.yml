name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libgl1-mesa-dev dpkg-dev patchelf

      - name: Build and deploy
        run: bash tools/02-make-executable/linux.sh

      - name: Create unsigned Debian package
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          mkdir -p "$package_dir/DEBIAN" \
            "$package_dir/usr/bin" \
            "$package_dir/usr/share/applications" \
            "$package_dir/usr/share/icons/hicolor/512x512/apps"

          install -m 0755 output/bin/photo-snap "$package_dir/usr/bin/photo-snap"
          install -m 0755 output/bin/photo-snap-cache-scanner "$package_dir/usr/bin/photo-snap-cache-scanner"
          cp -a output/bin/* "$package_dir/usr/bin/"
          install -m 0644 resources/photo-snap.desktop "$package_dir/usr/share/applications/photo-snap.desktop"
          install -m 0644 resources/photosnap.png "$package_dir/usr/share/icons/hicolor/512x512/apps/photosnap.png"

          shlibdeps_args=(
            -O
            "-l$package_dir/usr/bin"
            -e "$package_dir/usr/bin/photo-snap"
            -e "$package_dir/usr/bin/photo-snap-cache-scanner"
          )
          while IFS= read -r -d '' library; do
            shlibdeps_args+=(-e "$library")
          done < <(find "$package_dir/usr/bin" -type f -name '*.so*' -print0)
          shlibdeps_dir="$(mktemp -d)"
          mkdir -p "$shlibdeps_dir/debian"
          cat > "$shlibdeps_dir/debian/control" <<CONTROL
          Source: photo-snap
          Package: photo-snap
          Architecture: amd64
          Description: Photo Snap
          CONTROL
          shlibdeps_output="$(cd "$shlibdeps_dir" && dpkg-shlibdeps "${shlibdeps_args[@]}")"
          runtime_dependencies="${shlibdeps_output#shlibs:Depends=}"
          if [[ "$runtime_dependencies" == "$shlibdeps_output" || -z "$runtime_dependencies" ]]; then
            echo "dpkg-shlibdeps did not produce runtime dependencies" >&2
            exit 1
          fi

          cat > "$package_dir/DEBIAN/control" <<CONTROL
          Package: photo-snap
          Version: 1.0.0
          Section: graphics
          Priority: optional
          Architecture: amd64
          Depends: $runtime_dependencies
          Maintainer: Photo Snap Developers
          Description: Organize and browse a local photo archive
           Photo Snap is a cross-platform desktop application for managing a domestic photo archive.
          CONTROL

          dpkg-deb --build --root-owner-group "$package_dir" output/photo-snap_1.0.0_amd64.deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-snap-linux
          path: output/photo-snap_1.0.0_amd64.deb
          if-no-files-found: error
