name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build and deploy
        shell: pwsh
        run: |
          .\tools\02-make-executable\windows.ps1

      - name: Create unsigned installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }
          & $iscc /DAppVersion=1.0.0 installers\photo-snap.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-snap-windows
          path: output\Photo-Snap-Setup.exe
          if-no-files-found: error
